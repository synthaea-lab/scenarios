name: download-exec
platform: linux
script: download-exec.sh
simulates: >
  Ingress tool transfer followed by execution (T1105): curl downloads a small shell script
  from a loopback HTTP server into a fresh directory under /tmp, and the script is then
  executed by a second process, within the 60 s download-to-execution window.
expected_detections:
  - technique: "T1105"
    rule: check_download_then_exec   # crates/rules/src/download_state.rs — the exec's comm
                                      # is the basename of a path curl wrote; plus
                                      # rule_connect_filewrite (crates/correlator/src/rules.rs)
                                      # on curl itself, same technique string
    min_count: 2
    tolerance: 0
  - technique: "T1105/T1059/T1071"
    rule: rule_spawn_connect_filewrite   # crates/correlator/src/rules.rs — curl executes,
                                          # connects and writes under one pid
    min_count: 1
    tolerance: 0
  - technique: "T1059/T1071"
    rule: rule_spawn_connect   # crates/correlator/src/rules.rs — curl executes and connects
    min_count: 1
    tolerance: 0
  - technique: "T1059/T1036"
    rule: exec from a temporary directory   # crates/rules: the downloaded payload runs from /tmp
    min_count: 1
    tolerance: 0
  - technique: "T1571"
    rule: check_socket_listen_drift   # crates/rules (drift_state.rs): the scenario's own listener
    min_count: 1
    tolerance: 0
notes: >
  Lab run 2026-11-28 on Debian 12 (6.1.0-17): the payload's execution from /tmp
  (T1059/T1036) and the scenario's own HTTP server (T1571, raised from the `listen(2)`
  call) are expected since then.

  Live-tested 2026-11-26 on Debian 12 (6.1.0-17), agent at `main` (`2ce1d45b`) plus
  agent#365 (no rule change), eBPF sensor, scenario run as an unprivileged user, five runs
  (two with the rules checkout as content): exactly 2 T1105, 1 T1105/T1059/T1071 and 1
  T1059/T1071 each time. The two T1105 are check_download_then_exec on the payload's exec
  (`comm=syn-dl-payload executes .../syn-dl-payload, written 0.0s earlier by ... comm=curl`)
  and the correlator's rule_connect_filewrite on curl, which carries the same string; a
  sidecar counts by technique string, so both count. rule_connect_filewrite counts an
  extension-less write only under /tmp, /var/tmp, /dev/shm or a downloads directory
  (is_payload_file), so the drop directory is pinned to /tmp whatever TMPDIR says. With the
  rules checkout loaded, Sigma `susp_tmp_exec` (sigma/linux/susp_tmp_exec.yml) also raises
  T1059/T1036 once, on the payload's exec from /tmp; it is content, not an agent rule, so it
  is not listed. The script refuses to start when port 8093 is already in use (checked in
  /proc/net/tcp and tcp6) and runs the downloaded file only if it is byte-identical to the
  one it served (`cmp`): with a foreign server already on the port it exits 2 and runs
  nothing. A `cmp` mismatch exits 1, not 2: the port and server checks are preconditions,
  a mismatch means something is actively wrong. The listener wait reads /proc/net/tcp with
  builtins: a connecting probe raised BAYES and observe-mode RESPONSE-KILL in an earlier
  draft. No work directory left.
