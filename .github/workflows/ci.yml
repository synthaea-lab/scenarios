name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled re-run the sidecar gate when the `retrain` label changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# Read-only token for every job: nothing here writes to the repo, and a
# compromised step then can't push, tag or touch PRs.
permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash -n on every shell script
        run: git ls-files -z '*.sh' | xargs -0 -n 1 bash -n
      # Warnings and errors only: the info-level SC2016 notes are single-quoted `$` meant
      # literally (a command line handed to another shell).
      - name: shellcheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning
      - name: cleanup registry; no other EXIT trap
        run: bash tools/test-cleanup.sh
      - name: precondition helpers and exit codes
        run: bash tools/test-preconditions.sh
      - name: fake web server helper
        run: bash tools/test-fake-webserver.sh
      - name: work directory and throwaway file helpers
        run: bash tools/test-workdir.sh
      - name: EXPECT mode and self-check verdict helpers
        run: bash tools/test-self-check.sh
      - name: ML capture run.json writer
        run: bash tools/test-run-json.sh
      - name: signal.sh keeps its kill/verify-kill state out of /tmp
        run: bash tools/test-signal-state.sh
      - name: signal.sh preconditions and PASS/FAIL verdict
        run: bash tools/test-signal-checks.sh

  python-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned: an unpinned ruff release can start flagging unchanged code.
      - name: Install ruff
        run: pipx install ruff==0.17.0
      # The Python inline in the shell scripts stays inline (moving it to a file would change
      # the argv the agent sees), so it is compiled and linted here.
      - name: Inline Python compiles and lints clean
        run: python3 tools/check-python-snippets.py --ruff ruff
      - name: Inline Python checker
        run: RUFF=ruff bash tools/test-python-snippets.sh

  powershell-ascii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PowerShell scripts are ASCII-only
        run: python3 tools/check-ps1-ascii.py
      # pwsh ships on the ubuntu runner: every script must parse, and the shared
      # agent harness must keep writing the lab agent.toml byte for byte.
      - name: PowerShell scripts parse; common.ps1 harness helpers
        run: pwsh -NoProfile -File tools/test-common-ps1.ps1

  sidecar-bytes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every sidecar matches scenarios/sidecars.sha256
        run: python3 tools/check-sidecar-bytes.py
      # Editing, renaming or deleting a sidecar invalidates the model records bound to its
      # bytes, so it must come with a retrain; adding a new sidecar does not need the label.
      - name: A changed sidecar needs the `retrain` label
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RETRAIN: ${{ contains(github.event.pull_request.labels.*.name, 'retrain') }}
        run: |
          changed=$(git diff --name-only --diff-filter=MDR "$BASE...$HEAD" -- 'scenarios/*.yaml')
          if [ -z "$changed" ]; then
            echo "No existing sidecar changed."
            exit 0
          fi
          echo "Changed sidecars:"
          echo "$changed"
          if [ "$RETRAIN" != true ]; then
            echo "::error::These sidecars are bound by hash to trained model records; change them only together with a retrain, and label the PR 'retrain'."
            exit 1
          fi
          echo "Labelled 'retrain': allowed."
