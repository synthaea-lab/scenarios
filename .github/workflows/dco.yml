name: DCO

# Every commit in a pull request must carry a Developer Certificate of Origin sign-off
# (`git commit -s`). The check lives in one reusable workflow shared by every public
# synthaea-lab repository: https://github.com/synthaea-lab/.github/blob/main/.github/workflows/dco.yml

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    uses: synthaea-lab/.github/.github/workflows/dco.yml@main
